# ================= CacaoSmart IoT - Eclipse Mosquitto 2.0 =================
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Seguridad: sin acceso anónimo, usuarios con clave (PBKDF2-SHA512) + ACL por tópico
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# Mensajes retenidos de estado (device shadow) y colas para QoS 1
max_queued_messages 1000
max_inflight_messages 20

# Listener 1: MQTT sobre TCP (ESP32 reales, gemelos, datasets, servicios)
listener 1883
protocol mqtt

# Listener 2: MQTT sobre WebSocket (panel web, publicado por Caddy como wss://<dominio>/mqtt)
listener 9001
protocol websockets
