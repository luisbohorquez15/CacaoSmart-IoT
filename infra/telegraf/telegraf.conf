# ================= CacaoSmart IoT - Telegraf (MQTT -> InfluxDB) =================
# Suscriptor MQTT que persiste TODO el tráfico del sistema en la base de series de tiempo:
#   telemetry -> mediciones de sensores      status -> estado/ACK (device shadow)
#   command   -> bitácora de retroceso        alert  -> alertas del motor de reglas
[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# --------------------------------------------------------------- telemetría
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  username = "${MQTT_SERVICE_USER}"
  password = "${MQTT_SERVICE_PASS}"
  client_id = "telegraf-telemetry"
  persistent_session = true
  qos = 1
  topics = ["cacaosmart/+/+/+/telemetry"]
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  json_timezone = "UTC"
  tag_keys = ["type"]
  json_string_fields = ["mode", "state", "profile", "phase", "condition", "dominant"]
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "cacaosmart/+/+/+/telemetry"
    measurement = "_/_/_/_/measurement"
    tags = "_/region/zone/device/_"

# --------------------------------------------------------------- estado + ACK
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  username = "${MQTT_SERVICE_USER}"
  password = "${MQTT_SERVICE_PASS}"
  client_id = "telegraf-status"
  qos = 1
  topics = ["cacaosmart/+/+/+/status"]
  data_format = "json"
  json_string_fields = ["power", "mode", "profile", "last_cmd_cmd", "last_cmd_src", "last_cmd_msg", "last_cmd_cid"]
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "cacaosmart/+/+/+/status"
    measurement = "_/_/_/_/measurement"
    tags = "_/region/zone/device/_"

# --------------------------------------------------------------- comandos (retroceso) y alertas
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  username = "${MQTT_SERVICE_USER}"
  password = "${MQTT_SERVICE_PASS}"
  client_id = "telegraf-events"
  qos = 1
  topics = ["cacaosmart/+/+/+/command", "cacaosmart/+/+/+/alert"]
  data_format = "json"
  json_string_fields = ["cmd", "src", "cid", "state", "mode", "profile", "rule", "severity", "msg"]
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "cacaosmart/+/+/+/+"
    measurement = "_/_/_/_/measurement"
    tags = "_/region/zone/device/_"
