apiVersion: 1
datasources:
  - name: InfluxDB CacaoSmart
    uid: influx-cacao
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      timeInterval: 10s
    secureJsonData:
      token: ${INFLUX_TOKEN}
