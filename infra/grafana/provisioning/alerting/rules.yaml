        "settings": {
         "mode": "dropNN"
        }
       }
      },
      {
       "refId": "C",
       "datasourceUid": "__expr__",
       "model": {
        "refId": "C",
        "type": "threshold",
        "expression": "B",
        "conditions": [
         {
          "evaluator": {
           "type": "lt",
           "params": [
            30
           ]
          }
         }
        ]
       }
      }
     ]
    }
   ]
  }
 ]
}